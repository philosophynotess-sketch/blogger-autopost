name: Daily Fortune Blog Post

on:
  schedule:
    # KST 07:00 = UTC 22:00 (previous day)
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      force_category:
        description: 'Optional category override (daily_overview|zodiac_animals|star_signs|seo_deep)'
        required: false
        default: ''
      dry_run:
        description: 'Set to 1 to skip Blogger publish'
        required: false
        default: '0'

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate & Publish Fortune Post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          G_CLIENT_ID: ${{ secrets.G_CLIENT_ID }}
          G_CLIENT_SECRET: ${{ secrets.G_CLIENT_SECRET }}
          G_REFRESH_TOKEN: ${{ secrets.G_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          APP_NAME: ${{ secrets.APP_NAME }}
          APP_URL: ${{ secrets.APP_URL }}
          COUPANG_PARTNERS_URL: ${{ secrets.COUPANG_PARTNERS_URL }}
          COUPANG_TITLE: ${{ secrets.COUPANG_TITLE }}
          COUPANG_DESCRIPTION: ${{ secrets.COUPANG_DESCRIPTION }}
          COUPANG_BANNER_URL: ${{ secrets.COUPANG_BANNER_URL }}
          FORCE_CATEGORY: ${{ github.event.inputs.force_category }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: python main.py

      - name: Success Notification
        if: success()
        run: |
          echo "✅ 운세 포스트 게시 성공"
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

      - name: Failure Notification
        if: failure()
        run: |
          echo "❌ 운세 포스트 게시 실패"
          echo "📅 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
